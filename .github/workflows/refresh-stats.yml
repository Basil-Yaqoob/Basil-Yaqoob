name: Refresh stats card

on:
  schedule:
    # Mondays, 06:00 UTC (11:00 PKT)
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/refresh-stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Render stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit if the card changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.png
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Refresh stats card"
            git push
          fi
